configuration:
  server_protocol:
    name: Протокол подключения
  server_host:
    name: Адрес сервера
    description: >-
      IP-адрес или доменное имя без указания http:// и порта.
  server_port:
    name: Порт
    description: >-
      По умолчанию 4533. Оставьте пустым, если используется порт 80 или 443.
  user:
    name: Имя пользователя
    description: >-
      Укажите аккаунт, с которого вы ставите оценки. В Navidrome рейтинги привязаны к конкретному пользователю.
  password:
    name: Пароль
  music_folder_id:
    name: ID медиатеки на сервере
    description: >-
      Для Navidrome: если библиотека одна — обычно 1. Как узнать ID: В меню откройте раздел "Libraries" —> Откройте настройки нужной библиотеки —> Цифра в конце URL (например, "/#/library/1").
  sync_mode:
    name: Направление синхронизации
    description: >-
      Двунаправленная синхронизация объединяет данные. Односторонняя file-to-server перезаписывает оценки на сервере данными из файлов, server-to-file перезаписывает теги в файлах оценками с сервера.
  conflict_resolution:
    name: Разрешение конфликтов
    description: >-
      Применяется только для two-way режима и определяет приоритет источника (сервер или файл), если оценка изменена в обоих местах одновременно.
  sync_schedule_type:
    name: Режим запуска
    description: >-
      off — запуск только по команде из Home Assistant, interval — каждые N часов, daily — ежедневно в заданное время.
  sync_interval_hours:
    name: Интервал запуска в часах
    description: >-
      Только для режима interval. Минимум 1 час и только целые значения без указания минут.
  sync_time:
    name: Время ежедневного запуска
    description: >-
      Применяется только для режима daily. Формат времени: ЧЧ:ММ или ЧЧ:ММ:СС.
  sync_ratings:
    name: Синхронизировать рейтинги
    description: >-
      Звездный рейтинг.
  sync_likes:
    name: Синхронизировать лайки
    description: >-
      Отметки «избранное» в формате MusicBee.
  dry_run:
    name: Тестовый режим синхронизации (Dry-Run)
    description: >-
      Имитация синхронизации без записи данных. Все планируемые изменения только выводятся в журнал (лог). Используйте для первого запуска или для проверки настроек синхронизации.
  atomic_save:
    name: Атомарная запись файлов при сохранении тегов
    description: >-
      Защищает аудиофайлы от повреждения при параллельной записи разными программами и сбоях (нестабильная сеть/сбой питания). Рекомендуется для сетевых хранилищ (SMB/NFS). По умолчанию отключено для экономии ресурса SSD.
  delete_low_rated:
    name: Удаление треков с низким рейтингом
    description: >-
      Удаляет аудиофайл с диска безвозвратно, если его рейтинг равен 1★ или 0,5★. Работает при любом направлении синхронизации. Если синхронизация рейтингов отключена, то удаление выполняется только по оценкам на сервере (оценки в файлах игнорируются).
  debug:
    name: Debug-логирование
